[project]
name = "voice-call-qa"
version = "0.2.0"
description = "Per-agent quality checks for voice-agent call transcripts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["uvicorn>=0.30", "pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
