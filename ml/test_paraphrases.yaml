  consent:
    - "जानकारी के लिए बता दूँ, कॉल रिकॉर्ड हो रही है"
    - "इस बातचीत की रिकॉर्डिंग हो रही है, आपको ठीक है"
  vehicle:
    - "आपके पास खुद का दोपहिया है क्या"
    - "डिलीवरी के लिए आपके पास अपनी मोटरसाइकिल है"
    - "Aapke paas khud ki bike hai ya nahi"
  licence:
    - "गाड़ी चलाने का लाइसेंस आपके पास है"
    - "आपका DL बना हुआ है"
    - "Licence hai aapke paas gaadi chalane ka"
  area:
    - "आप किस जगह के आसपास काम करना चाहेंगे"
    - "कौन सा इलाका आपके लिए सही रहेगा"
    - "Aap kis jagah delivery karna pasand karoge"
  availability:
    - "आप हफ्ते के कितने दिन free रहते हैं"
    - "रोज़ कितने घंटे काम कर सकेंगे आप"
    - "Ek hafte mein kitne din kaam karoge"
  app_link:
    - "फ़ोन पर app का link भेजा है, उसे install कर लीजिए"
