  close:
    - "बहुत शुक्रिया, आगे की जानकारी जल्द भेजेंगे"
    - "धन्यवाद, आपसे फिर बात होगी"
  other:
    - "हाँ जी, एक सेकंड"
    - "अच्छा, समझ गया"
    - "आवाज़ साफ़ नहीं आ रही"
    - "ठीक है, आगे चलते हैं"
