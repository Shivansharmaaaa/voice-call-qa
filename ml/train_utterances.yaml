# Labelled agent utterances for training the step classifier.
# Written by hand: each line is something an agent could say for that step.
# The held-out test set (ml/test_paraphrases.yaml) is written separately and must not overlap.
# "other" = agent turns that are not any flow step (fillers, acknowledgements, checks).

